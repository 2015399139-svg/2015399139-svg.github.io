<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <pattern id="speck" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f4efe6"/><circle cx="2" cy="3" r="0.6" fill="#c8bfb2"/></pattern>
    <pattern id="steel" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#c5c8cc"/><path d="M0 3 H6" stroke="#aeb4ba" stroke-width="1"/></pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f7f5"/><stop offset="1" stop-color="#d9ddd8"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#e7e1da"/>
  <text x="80" y="100" fill="#5c4034" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="4">ONE MUG</text>
  <text x="80" y="160" fill="#1a100c" font-family="Songti SC, STSong, PMingLiU, serif" font-size="42">同一只杯子，三种材质</text>
  <g transform="translate(120 230)">
      <rect x="70" y="40" width="200" height="230" rx="18" fill="url(#speck)" stroke="#1a100c" stroke-width="2"/>
      <path d="M270 90 h36 a50 50 0 0 1 0 120 h-36" fill="none" stroke="#1a100c" stroke-width="16"/>
      <text x="170" y="360" text-anchor="middle" fill="#1a100c" font-family="Songti SC, STSong, PMingLiU, serif" font-size="32">白瓷</text>
      <text x="170" y="400" text-anchor="middle" fill="#5c4034" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2">CERAMIC</text>
    </g>
  <g transform="translate(580 230)">
      <rect x="70" y="40" width="200" height="230" rx="18" fill="url(#glass)" stroke="#1a100c" stroke-width="2"/>
      <path d="M270 90 h36 a50 50 0 0 1 0 120 h-36" fill="none" stroke="#1a100c" stroke-width="16"/>
      <text x="170" y="360" text-anchor="middle" fill="#1a100c" font-family="Songti SC, STSong, PMingLiU, serif" font-size="32">磨砂玻璃</text>
      <text x="170" y="400" text-anchor="middle" fill="#5c4034" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2">GLASS</text>
    </g>
  <g transform="translate(1040 230)">
      <rect x="70" y="40" width="200" height="230" rx="18" fill="url(#steel)" stroke="#1a100c" stroke-width="2"/>
      <path d="M270 90 h36 a50 50 0 0 1 0 120 h-36" fill="none" stroke="#1a100c" stroke-width="16"/>
      <text x="170" y="360" text-anchor="middle" fill="#1a100c" font-family="Songti SC, STSong, PMingLiU, serif" font-size="32">不锈钢</text>
      <text x="170" y="400" text-anchor="middle" fill="#5c4034" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2">STEEL</text>
    </g>
</svg>